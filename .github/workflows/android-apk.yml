name: Compilar APK Android

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'supabase/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pruebas y APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar Gradle Wrapper
        run: chmod +x gradlew

      - name: Ejecutar pruebas y compilar APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Obtener versión de la app
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "No se pudo leer versionName de app/build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Preparar APK con nombre de versión
        id: apk
        shell: bash
        run: |
          mkdir -p dist
          APK="dist/SKC-Facturas-v${{ steps.version.outputs.version }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Guardar APK como artefacto de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: SKC-Facturas-v${{ steps.version.outputs.version }}-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publicar nueva versión en GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La versión $TAG ya existe. El APK de este commit queda disponible en Actions."
            exit 0
          fi
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SKC Facturas $VERSION" \
            --generate-notes
